[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
documentfile = "1.1.0"
coroutines = "1.11.0"
jna = "5.19.1"
biometric = "1.1.0"
core = "1.19.1"
fragment = "1.9.1"
junit = "4.13.2"
kover = "0.9.10"
genai = "1.0.0-beta4"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "genai" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
