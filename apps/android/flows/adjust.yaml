# The day as a calendar: an edge dragged shortens a block and the rest follow, a drag past the
# locked ferry changes nothing, a handle moves a block, an added block joins in time order.
# Swipes are pixels on the 1080x2400 AVD, the screen at its top: with a block picked 11:00 is at 444, and a minute is 4.2 px.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: "Today"
- scrollUntilVisible:
    element: "Move the day about"
- tapOn: "Move the day about"
- assertVisible: "Drag a block by its handle.*"
- assertNotVisible: "15 minutes later"
- tapOn: "Lunch in the museum cloister.*"
# Lunch's bottom edge up half an hour: the way and the market come earlier with it.
- swipe:
    start: 597, 1473
    end: 597, 1328
    duration: 1000
- assertVisible: "14:35"
- assertVisible: "15:00"
# Dragged far down, past the ferry, a locked hour: it does not fit, and nothing moves.
- swipe:
    from: "Move Lunch in the museum cloister.*"
    direction: DOWN
- assertVisible: "13:15"
- assertVisible: "14:35"
- assertVisible: "15:00"
# By its handle, half an hour later.
- swipe:
    start: 975, 1074
    end: 975, 1219
    duration: 1000
- assertVisible: "13:45"
- assertNotVisible: "13:15"
# Scrolled from the ruler: the picked block's grip sits mid-screen, where a scroll starts.
- swipe:
    start: 100, 1800
    end: 100, 600
- scrollUntilVisible:
    element: "Add something"
- tapOn: "Add something"
- tapOn: "At what time"
- inputText: "16:00"
- tapOn: "What is it"
- inputText: "Ice cream by the river"
- tapOn: "Add it"
- scrollUntilVisible:
    element: "Ice cream by the river"
- tapOn: "Back"
- scrollUntilVisible:
    element: "13:45"
- scrollUntilVisible:
    element: "Ice cream by the river"
# The ferry is a locked hour, so it stays where the pack put it.
- scrollUntilVisible:
    element: "18:40"
