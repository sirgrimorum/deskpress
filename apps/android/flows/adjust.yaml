# The day like an agenda: an edge dragged shortens an hour and the rest follow, a drag past the
# locked ferry changes nothing, a handle moves an hour, an added block joins in time order.
# Swipes are pixels on the 1080x2400 AVD, the screen at its top.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: "Today"
- scrollUntilVisible:
    element: "Move the day about"
- tapOn: "Move the day about"
- assertVisible: "Drag an hour by its handle.*"
- assertNotVisible: "15 minutes later"
- tapOn: "Lunch in the museum cloister.*"
# Lunch's bottom edge up half an hour: the way and the market come earlier with it.
- swipe:
    start: 540, 1183
    end: 540, 1096
    duration: 1000
- assertVisible: "14:35"
- assertVisible: "15:00"
# Dragged far down, past the ferry, a locked hour: it does not fit, and nothing moves.
- swipe:
    from: "Move Lunch in the museum cloister.*"
    direction: DOWN
- assertVisible: "13:15"
- assertVisible: "14:35"
- assertVisible: "15:00"
# By its handle, half an hour later.
- swipe:
    start: 954, 1026
    end: 954, 1136
    duration: 1000
- assertVisible: "13:45"
- assertNotVisible: "13:15"
# Scrolled from the hours' column: the picked hour's grip sits mid-screen, where a scroll starts.
- swipe:
    start: 100, 1800
    end: 100, 600
- scrollUntilVisible:
    element: "Add something"
- tapOn: "Add something"
- tapOn: "At what time"
- inputText: "16:00"
- tapOn: "What is it"
- inputText: "Ice cream by the river"
- tapOn: "Add it"
- scrollUntilVisible:
    element: "Ice cream by the river"
- tapOn: "Back"
- scrollUntilVisible:
    element: "13:45"
- scrollUntilVisible:
    element: "Ice cream by the river"
# The ferry is a locked hour, so it stays where the pack put it.
- scrollUntilVisible:
    element: "18:40"
