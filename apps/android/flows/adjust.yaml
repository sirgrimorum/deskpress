# Moving the day about: an hour shifts and the day keeps it, one dragged down the day trades places
# and the way to it follows, and a block of your own joins in time order. Nothing is written back
# to the pack: every edit is a fact of its own.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: "Today"
- scrollUntilVisible:
    element: "Move the day about"
- tapOn: "Move the day about"
- assertVisible: "Pick an hour to move.*"
- tapOn: "Lunch in the museum cloister.*"
- scrollUntilVisible:
    element: "15 minutes later"
- tapOn: "15 minutes later"
- scrollUntilVisible:
    element: "13:30"
    direction: UP
# Dragged as far down as it goes: the ferry is locked, so the museum stops after the market, and
# the way from the market to it shows.
- scrollUntilVisible:
    element: "Move Museu Nacional do Azulejo.*"
    direction: UP
- swipe:
    from: "Move Museu Nacional do Azulejo.*"
    direction: DOWN
- scrollUntilVisible:
    element: "→ Museu Nacional do Azulejo"
- assertVisible: "16:25"
- scrollUntilVisible:
    element: "Add something"
- tapOn: "Add something"
- tapOn: "At what time"
- inputText: "16:00"
- tapOn: "What is it"
- inputText: "Ice cream by the river"
- tapOn: "Add it"
- scrollUntilVisible:
    element: "Ice cream by the river"
- tapOn: "Back"
- scrollUntilVisible:
    element: "16:25"
- assertVisible: "Ice cream by the river"
# The ferry is a locked hour, so it stays where the pack put it.
- scrollUntilVisible:
    element: "18:40"
