# The choices the shell makes rather than the pack: how big the text is, which map app opens.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: "Menu"
# The trip goes to another phone and comes back through the menu; the flows never send one.
- assertVisible: "Send the trip…"
- assertVisible: "Take a trip sent to you…"
- tapOn: "Settings"
- assertVisible: "TEXT SIZE"
- assertVisible: "MAPS OPEN IN"
- tapOn: "Large"
# Only the map apps on this phone are offered, and the phone asking is always one.
- tapOn: "Ask"
# The trip's maps are kept only on a press, with the size said first; the flows never press it.
- scrollUntilVisible:
    element: "Keep the trip's maps"
- assertVisible: "MAPS OFFLINE"
- assertVisible: "Not kept\\. About \\d+ MB for the trip's places\\."
- assertNotVisible: "Delete"
- tapOn: "Back"
- assertVisible: "Now · visit"
# Kept across a restart, like every shell choice.
- launchApp:
    stopApp: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: "Menu"
- tapOn: "Settings"
- assertVisible: "MAPS OPEN IN"
