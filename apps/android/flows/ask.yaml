# The menu of questions the pack answers by itself: every answer is already in the view, so a tap
# only shows it. The phone's own model is not covered here; a device without one has to be whole.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- scrollUntilVisible:
    element: "Ask about the trip"
- tapOn: "Ask about the trip"
- assertVisible: "What is happening now?"
- assertVisible: "Show the answer"
# The pack writes questions of its own, and they come with the template's.
- assertVisible: "Where are the toilets?"
- tapOn: "What is happening now?"
- assertVisible: "11:15 Museu Nacional do Azulejo, start on the top floor and come down."
- tapOn: "Back"
- assertVisible: "Now · visit"
# Nothing is typed anywhere: with no model on this device there is no box to type in.
- scrollUntilVisible:
    element: "Ask about the trip"
- tapOn: "Ask about the trip"
- assertNotVisible: "Ask in your own words"
