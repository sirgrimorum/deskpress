# A tap opens the detail a moment has no room for, and Back returns to the moment.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: "Point by point"
- assertVisible: "MUSEU NACIONAL DO AZULEJO"
- assertVisible: "The small cloister"
- tapOn: "Back"
- assertVisible: "Point by point"
