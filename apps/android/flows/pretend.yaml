# Trying a moment out on the phone: the clock set by hand runs on from there, a place is pretended
# instead of the real position, and a strip says so on every screen until both go back. A tap on
# what comes next, or on a block of the day, tries that block out, and the strip brings back now.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- assertVisible: "Now · visit"
- tapOn: "Menu"
- tapOn: "Settings"
# A day on: the next day's question is up, though the frozen clock still says the 11th.
- scrollUntilVisible:
    element: "\\+1 day"
- tapOn: "\\+1 day"
- assertVisible: "THE MOMENT: PRETEND"
- scrollUntilVisible:
    element: "azulejo"
- tapOn: "azulejo"
- tapOn: "Back"
- assertVisible: "Not now: 2026-04-12 11:30, at azulejo. Tap to change."
- assertVisible: 'Sintra or the beach tomorrow\?'
- tapOn: "Not now.*"
- scrollUntilVisible:
    element: "Back to now"
- tapOn: "Back to now"
- scrollUntilVisible:
    element: "Where I really am"
- tapOn: "Where I really am"
- tapOn: "Back"
- assertNotVisible: "Not now.*"
- assertVisible: "Now · visit"
# The next block, from the bar at the bottom.
- tapOn: "Lunch in the museum cloister.*"
- assertVisible: "Now · meal"
- assertVisible: "Not now: 2026-04-11 13:15, at azulejo. Tap to change."
# A block of the day, from the agenda.
- tapOn: "Today"
- scrollUntilVisible:
    element: "Ferry from Cais do Sodre.*"
- tapOn: "Ferry from Cais do Sodre.*"
- assertVisible: "Now · transfer"
- assertVisible: "Not now: 2026-04-11 18:40, at cais_do_sodre. Tap to change."
- tapOn: "Back to now"
- assertNotVisible: "Not now.*"
- assertVisible: "Now · visit"
