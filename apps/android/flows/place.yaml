# A tap opens the block's place, and Back returns to the block.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: "About the place"
- assertVisible: "Museu Nacional do Azulejo"
- assertVisible: "The small cloister"
- tapOn: "Back"
- assertVisible: "About the place"
