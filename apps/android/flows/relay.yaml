# Whose phone it is: a child picked goes straight to their own screen.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T11:30"
- tapOn: 'Whose phone is it\?'
- assertVisible: "Rita"
# The block names Tomas its guide, so he carries the star.
- tapOn: "★ Tomas"
# The place's script first, since they guide it, then the points for kids.
- assertVisible: "You could be the guide"
- tapOn: "Show the answer"
- assertVisible: "They keep the walls cool.*"
- scrollUntilVisible:
    element: "Count the lions.*"
- scrollUntilVisible:
    element: "Give the phone back"
