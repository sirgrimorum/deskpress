# The day before its first block: the first hour, and the way to the whole plan.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-11T09:00"
- assertVisible: "10:30"
- assertVisible: "Spring; showers pass quickly, 12 to 20"
- assertVisible: "Body clock"
- assertVisible: "Morning light on the walk, sunglasses off"
- assertVisible: "See the day"
- assertNotVisible: "Point by point"
# Who the day is for is the pack's to know, not a card.
- assertNotVisible: "WHO"
