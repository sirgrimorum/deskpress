# Before the trip: the list of days, and the body clock already moving.
appId: dev.deskpress.app
---
- launchApp:
    clearState: true
    arguments:
      now: "2026-04-10T09:00"
- assertVisible: "THE DAYS OF THIS TRIP"
- assertVisible: "The plan does not cover today."
- assertVisible: "The tile museum and the late ferry"
- assertVisible: "2026-04-11"
- assertVisible: "To bed an hour before home time"
