name: Bug Report
description: Report a defect or broken behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide clear, concise details about what went wrong.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened according to the pack format or documentation.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How can this be reproduced? Include minimal YAML or test case if applicable.
    validations:
      required: true
