name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test with 100% coverage gate
        run: cargo llvm-cov --workspace --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100

  android:
    name: Android Host & Tests
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and SDK components
        run: |
          yes | sdkmanager --install "ndk;30.0.16248370" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Run Android tests and build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: make android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deskpress-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
