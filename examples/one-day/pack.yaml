# The smallest pack worth reading: one day, the choice for the next, two places, two people,
# one alert.
# Copy the folder, change the content, load it. Nothing here needs the shell to be changed.
# `extends: travel` brings the screens and the rules of a trip, so this file only says what is
# particular to this pack. See templates/travel/pack.yaml for what it gets.

pack:
  id: one-day
  name: One day
  language: en
  timezone: Europe/Lisbon
  content: content.yaml
  theme: theme.yaml
  extends: travel

conventions:
  alert_prefixes: [warn, alert]
  hidden_prefixes: [source]

# A label of the template, said this pack's way.
ui:
  days: The days of this trip
