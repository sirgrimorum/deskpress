people:
  - {id: rita,  name: Rita,  adult: true}
  - {id: tomas, name: Tomas, adult: false, language: pt}

documents:
  - id: insurance_rita
    title: Travel insurance
    for: rita
    file: files/insurance-rita.pdf
    call: {Assistance: "+1 555 0100", Emergency: "112"}
    fields:
      Certificate: EX-0001
      Cover: "Medical, repatriation included"

days:
  - date: 2026-04-11
    title: The tile museum and the late ferry
    who: [rita, tomas]
    blocks:
      - ["", "Nothing before 10:00. The ferry back is the only fixed hour."]
      - ["10:30", "Walk up through Graca. Shade on the left side of the street.",
         {type: walking, duration: 40 min,
          road: [{at: "10:45", name: Largo da Graca, what: "The miradouro is one street to the left."},
                 {name: The steep stretch, what: "Stairs first, then the street flattens out."}]}]
      - ["11:15", "Museu Nacional do Azulejo, start on the top floor and come down.",
         {type: visit, place: azulejo, guide: tomas, until: "13:00", ticket: sheets.bookings.azulejo,
          source_note: "Opening hours checked on the museum site"}]
      - ["13:15", "Lunch in the museum cloister. It is the cheap one, not the famous one.",
         {type: meal}]
      - ["18:40", "Ferry from Cais do Sodre. Last one that connects is 19:10, do not wait for it.",
         {type: transfer, place: cais_do_sodre, locked: true, until: "19:15", leave: 25}]
  # The next day is still open: two plans, asked the evening before.
  - date: 2026-04-12
    title: Sintra or the beach
    who: [rita, tomas]
    fixed:
      - ["09:00", "Breakfast at the guesthouse.", {type: meal}]
    options:
      - id: sintra
        name: Sintra
        recommended: true
        why: "The palaces are quieter before the weekend."
        blocks: [["10:00", "Train to Sintra from Rossio.", {type: train}]]
      - id: beach
        name: The beach
        why: "Warm enough for the sand, not for the water."
        blocks: [["10:30", "Train to Cascais from Cais do Sodre.", {type: train}]]
    decision: {when: 2026-04-11, at: "20:00", question: "Sintra or the beach tomorrow?"}

places:
  azulejo:
    name: Museu Nacional do Azulejo
    kind: museum
    at: {lat: 38.7248, lon: -9.1139, radius_m: 120}
    safe: true
    verified: 2026-03-02
    during:
      type: visit
      hours: "10:00 to 18:00, closed on Mondays"
      toilets: "Ground floor, past the shop"
      warn_bags: "Backpacks go in the lockers, 1 EUR coin, returned"
    points:
      - id: panorama
        name: The great Lisbon panorama
        what: "Twenty three metres of the city as it looked before the earthquake."
        why: "It is the only picture of the streets that are gone."
        for_kids: "Find the boat with three masts. There are four of them."
      - id: cloister
        name: The small cloister
        what: "Manueline arches, and the quietest bench in the building."
        for_kids: "Count the lions. They are all different on purpose."
    # What the child the block names as guide tells the family.
    guide:
      facts:
        - "Azulejo comes from an Arabic word for a small polished stone."
        - "The building was a convent five hundred years ago."
      question: "Why did people put tiles on the outside of houses?"
      answer: "They keep the walls cool and dry, and they are easy to clean."
      challenge: "Find a tile with a bird and show it to everybody."
  cais_do_sodre:
    name: Cais do Sodre ferry terminal
    kind: ferry terminal
    at: {lat: 38.7062, lon: -9.1449, radius_m: 200}
    parking:
      where: "Ribeira das Naus, on the water side"
      price: "[to confirm]"
      verified: 2026-03-02
    # The terminal itself, drawn as fractions of the picture. This example ships no picture, so
    # the pins show on plain paper.
    plan:
      caption: "The hall, from the street door"
      points:
        - {name: Ticket machines, x: 0.2, y: 0.3, kind: tickets}
        - {name: "Gate 3, the Cacilhas boat", x: 0.75, y: 0.55, kind: gate}
        - {name: Toilets, x: 0.45, y: 0.85, kind: toilets}

alerts:
  - id: ferry_last_connection
    severity: high
    at: 2026-04-11T18:40
    notify_from: 2026-04-11T17:30
    title: "The 19:10 ferry does not connect"
    detail: "It arrives after the last bus on the other side. The 18:40 is the one that gets you home."
    action: "Leave the museum cafe by 18:10"

climate:
  units: metric
  entries:
    - {month: 4, high: 20, low: 12, rain: 35, sunrise: "06:55", sunset: "20:10",
       summary: "Spring; showers pass quickly"}
    - {place: azulejo, date: 2026-04-11, summary: "Warm for April, and dry inside the museum"}

sheets:
  # `check: true` turns the items into rows to tick off, each one remembered on the device.
  packing:
    check: true
    items:
      - Sun hat for each of them
      - The two water bottles
      - Coins for the museum lockers
      - Charger and the short cable
    note: "Two changes each. The guesthouse has a washing line."
  bookings:
    - id: azulejo
      what: "Museum, one adult one child"
      code: "MNA-20418"
      when: 2026-04-11T11:15
  phrases:
    portuguese:
      - {there: "Dois bilhetes, por favor", here: "Two tickets, please"}
      - {there: "Onde fica a casa de banho?", here: "Where is the toilet?"}
