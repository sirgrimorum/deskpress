[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
# MSVC prints "Creating library" for every cdylib; a status line, not a problem
linker_messages = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
